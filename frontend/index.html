<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TW Courses</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand">TW Courses</a>
      <nav id="nav" class="nav"></nav>
      <button id="settingsBtn" class="icon-btn" title="API postavke">⚙</button>
    </div>
  </header>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-panel-inner">
      <label for="apiBaseInput">API bazni URL</label>
      <input id="apiBaseInput" type="text" placeholder="http://localhost:5019/api" />
      <button id="apiBaseSave" class="btn btn-primary">Spremi</button>
      <span class="hint">Zadano: http://localhost:5019/api (vidi launchSettings.json u API-ju)</span>
    </div>
  </div>

  <main id="app" class="app"></main>

  <div id="toastContainer" class="toast-container"></div>

  <footer class="footer">
    <span>TW Courses frontend &middot; komunicira s TW_Courses_API</span>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views/public.js"></script>
  <script src="js/views/account.js"></script>
  <script src="js/views/exam.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
